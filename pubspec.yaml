name: gymcoach
description: App offline para professor de academia gerenciar alunos e treinos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado e injeção de dependência
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navegação
  go_router: ^13.2.0

  # Banco de dados local
  sqflite: ^2.3.2
  path: ^1.9.0

  # Diretório de documentos do app (onde fotos são salvas)
  path_provider: ^2.1.0

  # Redimensionamento e compressão de imagens (fotos de alunos)
  flutter_image_compress: ^2.1.0

  # Seleção de imagem via câmera ou galeria do dispositivo
  image_picker: ^1.1.2

  # Modelos imutáveis e geração de código
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Geradores de código (só rodam em desenvolvimento)
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true